name: release

# 打 tag 触发：git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # macOS 的二进制注入后必须重新签名，所以放到 mac runner 上跑
  build-mac:
    runs-on: macos-14
    env:
      # 没有配置这些 secrets 时，签名/公证步骤会自动跳过（产物是 ad-hoc 签名）
      MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    strategy:
      matrix:
        platform: [mac-arm64, mac-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: 打包 ${{ matrix.platform }}
        run: node scripts/build-desktop.mjs ${{ matrix.platform }}
      - name: 签名（Developer ID，可选）
        if: env.MAC_CERT_P12 != ''
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          codesign --force --options runtime --timestamp \
            --sign "$MAC_SIGN_IDENTITY" dist/watchEverywhere-${{ matrix.platform }}

      - name: 公证（可选）
        if: env.APPLE_ID != ''
        run: |
          ditto -c -k --keepParent dist/watchEverywhere-${{ matrix.platform }} /tmp/app.zip
          xcrun notarytool submit /tmp/app.zip --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple dist/watchEverywhere-${{ matrix.platform }} || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/watchEverywhere-${{ matrix.platform }}
          if-no-files-found: error

  # Windows 包不需要签名，直接在 windows runner 上注入
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - shell: bash
        run: npm ci
      - name: 打包 win-x64
        shell: bash
        run: node scripts/build-desktop.mjs win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: dist/watchEverywhere-win-x64.exe
          if-no-files-found: error

  release:
    needs: [build-mac, build-win]
    # mac 任务被取消（例如 macOS 额度用尽）时，只要 win 成功也照样发 Release，
    # 缺的 mac 包可以事后手动补传
    if: always() && needs.build-win.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成更新清单
        env:
          WE_RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x dist/watchEverywhere-mac-* 2>/dev/null || true
          node scripts/make-manifest.mjs "$VERSION" "见 Release 说明"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/watchEverywhere-*
            dist/latest.json
          generate_release_notes: true
